name: Build and upload pure Python package to PyPI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate package without publishing to PyPI
        required: true
        default: true
        type: boolean

jobs:
  release-pypi-pure:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -r python-pure/tests/requirements_lock.txt

      - name: Test pure Python package
        run: PYTHONPATH=python-pure python -m pytest -o cache_dir=/tmp/opencc-pure-pytest-cache python-pure/tests

      - name: Build pure Python distributions
        run: python -m build --sdist --wheel --outdir dist python-pure

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: opencc-py-dist
          path: dist/*

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
